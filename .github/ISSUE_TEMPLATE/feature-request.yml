name: Feature request
description: Request an improvement that solves a problem.
type: Feature
labels: [needs-triage]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: "What problem should be solved?"
    validations:
      required: true
  - type: textarea
    id: audience
    attributes:
      label: Affected people
      description: "Who is affected and in what situation?"
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: "What should people be able to do, and how could we verify it?"
    validations:
      required: true
